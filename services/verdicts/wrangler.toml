# The backlog verdicts service on Cloudflare. The names below are
# placeholders: `npx wrangler d1 create` prints the database's real id, which
# goes in `database_id` in the operator's own copy, never in the repository.
# README.md has the steps.
name = "upnext-verdicts"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# The daily snapshot, in UTC.
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "upnext-verdicts"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "upnext-verdicts"

[vars]
# Who runs this copy, and a page to reach them, for /terms. The project's own
# copy names "UpNext contributors" and the repository's issues; a copy run by
# someone else names its own operator and contact here.
OPERATOR = "UpNext contributors"
CONTACT_URL = "https://github.com/zytocc/upnext/issues"
# Cloudflare Access for /admin: the team's address
# (https://<team>.cloudflareaccess.com) and the Access application's
# audience tag. The admin pages answer 404 until both are set.
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
