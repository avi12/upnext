[workspace]
members = ["cargo:."]

# The release workflow (.github/workflows/release.yml) is generated from this
# file by dist (formerly cargo-dist): after changing it, regenerate the
# workflow (see allow-dirty below) and commit both. A `v*` tag such as v0.1.0 builds the archives and
# publishes the GitHub release; docs/dev/RELEASE.md has the steps.
[dist]
# The dist version the release workflow installs (Cargo.toml SemVer syntax).
cargo-dist-version = "0.33.0"
ci = "github"
hosting = "github"
# Dependabot bumps the actions in release.yml like any workflow's, which
# dist would otherwise refuse as a hand edit of its generated file and fail
# the release's plan job. With this set, `dist generate` leaves release.yml
# alone too: to regenerate it after changing this file, comment the line out,
# run `dist generate`, and put it back. release.yml also carries hand edits
# (actions pinned to commit SHAs, per-job permissions, dist's installer
# checked against its SHA-256; its header lists them) that a regenerated
# file loses: put them back before committing it.
allow-dirty = ["ci"]
# Archives only, each with its SHA-256 checksum, and no install scripts.
# The Windows MSI isn't dist's: dist's WiX template installs for every user
# under Program Files, behind an administrator prompt, and builds the MSI in
# the same step as the programs, leaving no room to sign them first. The
# release workflow's hand-added build-msi job builds UpNext's per-user MSI
# from the programs in the Windows zip instead, with contrib/windows/build-msi.ps1,
# the script development builds use too.
installers = []
# Linux x86_64 and arm64 (.tar.xz) and Windows x86_64 (.zip, built with
# MSVC, which links WebView2's loader into the exe). The release workflow's
# hand-added build-linux-packages job repacks both Linux archives' programs
# as .deb and .rpm packages with contrib/linux/build-packages.sh, and its
# publish-cloudsmith job pushes those to the apt and dnf repositories.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A release build has the web UI built into it from web/dist (src/server/ui.rs),
# so the build job builds it first, as the Dockerfile does.
github-build-setup = "../build-setup.yml"
# Beside the binaries, the README, the CHANGELOG and the licences, which dist
# adds itself: the third-party notices (THIRD_PARTY_NOTICES.txt, generated by
# contrib/notices/generate.mjs), the systemd user service from the README's
# "Start it at login", and the launcher entry and its icons, which the Arch
# package installs from the archive (contrib/arch/upnext-bin/PKGBUILD).
# dist puts each at the archive's root, so the icons are in icons/hicolor/.
include = ["THIRD_PARTY_NOTICES.txt", "contrib/systemd/upnext.service", "contrib/linux/upnext.desktop", "contrib/linux/icons"]
# The desktop feature (the app window and the GOG login window) links
# WebKitGTK 4.1 and GTK 3.
[dist.dependencies.apt]
"libwebkit2gtk-4.1-dev" = "*"
libgtk-3-dev = "*"

# arm64 builds natively on GitHub's arm64 runner (free for public
# repositories), with no cross-compiling of WebKitGTK or aws-lc. Ubuntu 22.04
# as for x86_64, so both need glibc 2.35 or newer.
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
