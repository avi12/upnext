# cargo-about's settings for THIRD_PARTY_NOTICES.txt (generate.mjs runs it).
#
# The licences UpNext uses a crate under, in the order it picks from an
# expression such as "MIT OR Apache-2.0": MIT first, then the rest of
# deny.toml's allowed list. A crate whose only licences aren't here fails
# the run, as it fails cargo deny.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "MIT-0",
  "0BSD",
  "CC0-1.0",
]
# What the release builds: dist's three targets (dist-workspace.toml).
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
# Build scripts, their dependencies and the tests' crates aren't in the
# programs.
ignore-build-dependencies = true
ignore-dev-dependencies = true
