<!doctype html>
<html lang="en" data-theme="arcade">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101218" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="UpNext" />
    <title>UpNext</title>
    <script>
      // Apply the last used theme before first paint (lib/theme.ts keeps this in sync).
      try {
        var t = localStorage.getItem('upnext.theme')
        var f = localStorage.getItem('upnext.themeFollow') === '1'
        if (f && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'daylight'
        if (t === 'arcade' || t === 'ember' || t === 'daylight') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
